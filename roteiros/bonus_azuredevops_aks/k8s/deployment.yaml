apiVersion: apps/v1
kind: Deployment
metadata:
  name: tarefas-api
  namespace: production
  labels:
    app: tarefas-api
    canal: devopsraiz
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tarefas-api
  template:
    metadata:
      labels:
        app: tarefas-api
    spec:
      containers:
        - name: api
          image: devopsraizacr.azurecr.io/devopsraiz/tarefas-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tarefas-api-db
                  key: url
            - name: ENV
              value: production
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
      imagePullSecrets:
        - name: acr-pull-secret
