name: Renovar token Meta (mensal)

# Token long-lived da Meta dura 60 dias. Esse workflow roda todo dia 1
# do mês e troca o token atual por um novo de 60 dias.
#
# Pré-requisito: ter META_APP_ID e META_APP_SECRET nos Secrets do repo.

on:
  schedule:
    - cron: "0 9 1 * *"   # dia 1 do mês às 06:00 BRT
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trocar por novo long-lived token
        env:
          APP_ID: ${{ secrets.META_APP_ID }}
          APP_SECRET: ${{ secrets.META_APP_SECRET }}
          CURRENT_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          RESP=$(curl -s "https://graph.facebook.com/v21.0/oauth/access_token?grant_type=fb_exchange_token&client_id=${APP_ID}&client_secret=${APP_SECRET}&fb_exchange_token=${CURRENT_TOKEN}")
          echo "$RESP"
          NEW=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          if [ -z "$NEW" ]; then
            echo "::error::Não consegui obter novo token"
            exit 1
          fi
          echo "::add-mask::$NEW"
          echo "✓ Novo token gerado (duração 60 dias)."
          echo "Atualize manualmente o secret META_ACCESS_TOKEN com esse valor:"
          echo "  Settings → Secrets and variables → Actions → META_ACCESS_TOKEN"
          echo "Valor (copie sem quebras): "
          echo "$NEW"
