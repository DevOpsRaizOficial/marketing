name: Gerar vídeos HeyGen e subir no repo

# Gera os 6 Reels (Dias 1, 3, 9, 16, 21, 26) via HeyGen API,
# baixa os MP4s e faz commit na pasta videos_mp4/ (ou release assets).
#
# Rode UMA vez depois de configurar HEYGEN_AVATAR_ID e HEYGEN_VOICE_ID.
# Demora ~15-30 minutos (cada vídeo leva 2-5 min no HeyGen).

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Dias a gerar (vírgula-separado, ex: 1,3,9,16,21,26). Vazio = todos."
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: automacao
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Criar .env a partir dos secrets
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID: ${{ secrets.HEYGEN_AVATAR_ID }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
        run: |
          cat <<EOF > .env
          HEYGEN_API_KEY=${HEYGEN_API_KEY}
          HEYGEN_AVATAR_ID=${HEYGEN_AVATAR_ID}
          HEYGEN_VOICE_ID=${HEYGEN_VOICE_ID}
          EOF

      - name: Gerar vídeos
        run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then
            DAYS="1,3,9,16,21,26"
          fi
          IFS=',' read -ra DIAS <<< "$DAYS"
          mkdir -p ../videos_mp4
          for dia in "${DIAS[@]}"; do
            dia_pad=$(printf "%02d" $dia)
            script_file=$(ls ../roteiros/reel-dia-${dia_pad}-*.txt 2>/dev/null | head -1)
            if [ -z "$script_file" ]; then
              echo "⚠ Sem roteiro pra dia ${dia}, pulando"
              continue
            fi
            echo "→ Dia ${dia}: $script_file"
            python heygen_client.py generate \
              --script "$script_file" \
              --output "../videos_mp4/reel-dia-${dia_pad}.mp4"
          done

      - name: Listar arquivos gerados
        working-directory: .
        run: |
          echo "Arquivos em videos_mp4/:"
          ls -la videos_mp4/ || echo "(pasta não existe)"

      - name: Commitar MP4s no repo (com -f caso .gitignore esteja mal configurado)
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f videos_mp4/*.mp4 2>/dev/null || true
          git status
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "Nenhum vídeo novo pra commitar"
          else
            git commit -m "feat: reels HeyGen gerados automaticamente"
            git push
          fi
